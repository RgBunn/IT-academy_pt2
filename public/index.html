<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="tetris-wrapper">
    <div class="tetris-grid" id="tetris-grid">
        <div id="pause-overlay">
            <h2>PAUSED</h2>
        </div>
    </div>
    <div class="dashboard">
        <div class="next-tetromino_container" id="mini-grid"></div>
        <div class="button-box">
            <button id="btn-pause" class="btn">Pause</button>
        </div>
        <div class="score-container">score<span id="game-score">0</span></div>
        <div class="level-container">level <span id="game-level">1</span></div>
    </div>
    <dialog class="modal" id="game-over__modal">
        <h1>Game over!</h1>
        <div class="final-score__container">
            your score is: <span id="final-score"></span>
        </div>
        <form action="" id="add-name__form">
            <input
                    type="text"
                    name="player"
                    placeholder="please enter your name"
            />
            <button class="comics-style-btn">Add name</button>
        </form>
        <h2>Leaderboard</h2>
        <ul id="leaderboard-list"></ul>
        <button class="comics-style-btn" id="play-again__button">
            Play again
        </button>
    </dialog>
</div>
<script src="../src/index.js"></script>
</body>
</html>
